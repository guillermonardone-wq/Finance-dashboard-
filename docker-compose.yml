version: "3.9"

services:
  # ─── PostgreSQL ──────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: racing
      POSTGRES_PASSWORD: racing
      POSTGRES_DB: racing_coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racing -d racing_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ──
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO bucket setup ─────────────────
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/racing-coach-uploads --ignore-existing;
      mc mb local/racing-coach-generated --ignore-existing;
      mc anonymous set download local/racing-coach-generated;
      exit 0;
      "

  # ─── Python Analysis Service (HTTP) ─────
  analysis:
    build: ./services/analysis
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://racing:racing@postgres:5432/racing_coach
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── Python Analysis Worker (Redis consumer) ──
  worker:
    build: ./services/analysis
    command: python -m app.worker
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://racing:racing@postgres:5432/racing_coach
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
