version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: signalforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-signalforge}
      POSTGRES_USER: ${DB_USER:-signalforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-signalforge}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
